name: game_booster
description: "A sleek Game Booster launcher."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_apps: ^2.2.0
  permission_handler: ^11.3.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# CONFIGURATION PARA SA ICON (ANDROID LANG, WALANG IOS ERROR)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

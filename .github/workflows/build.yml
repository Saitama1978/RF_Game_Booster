name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Rebuild Project Structure & Preserve Files
        run: |
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/main.dart
          cp pubspec.yaml temp_backup/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml temp_backup/AndroidManifest.xml || true
          flutter create . --org com.renantefullo.gamebooster --project-name game_booster --overwrite
          cp temp_backup/main.dart lib/main.dart
          cp temp_backup/pubspec.yaml pubspec.yaml
          cp temp_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-booster-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
